<!DOCTYPE html>
<html>
<head>
<title>Zandu Blam Analyzer ❤️</title>

<style>

body{
background:linear-gradient(135deg,#ffb6c1,#ffc0cb,#ffd1dc);
font-family:monospace;
text-align:center;
padding-top:80px;
}

h1{
font-size:38px;
color:#d6336c;
}

#terminal{
width:75%;
margin:auto;
background:white;
padding:25px;
border-radius:12px;
box-shadow:0 0 15px rgba(0,0,0,0.2);
font-size:18px;
text-align:left;
min-height:250px;
}

button{
margin-top:20px;
padding:12px 25px;
font-size:18px;
border:none;
border-radius:10px;
cursor:pointer;
}

#start{
background:#ff4d6d;
color:white;
}

#yes{
background:#ff4d6d;
color:white;
}

#no{
background:#888;
color:white;
}

#comment{
margin-top:20px;
font-size:20px;
font-weight:bold;
color:#444;
}

.appreciation{
max-width:900px;
margin:30px auto;
background:white;
padding:30px;
border-radius:15px;
box-shadow:0 0 15px rgba(0,0,0,0.15);
line-height:1.8;
text-align:left;
font-size:18px;
color:#444;
}

</style>
</head>

<body>

<h1>Zandu Blam Analyzer ❤️</h1>

<div id="terminal">

System Ready...

<br><br>

Click Start To Run Analysis.

</div>

<button id="start">Run Analysis</button>

<div id="comment"></div>

<script>

const terminal = document.getElementById("terminal");
const startBtn = document.getElementById("start");

const lines = [

"Initializing Emotional Analysis...",

"Connecting To Friendship Database...",

"Searching For Hema...",

"User Found: Zandu Blam ❤️",

"Checking Smile Index...",

"Loading Memories...",

"Analyzing Conversations...",

"Detecting Cute Moments...",

"Calculating Happiness Level...",

"Processing...",

"Processing...",

"Processing...",

"RESULT FOUND.",

"",

"Friendship Score : 100%",

"Trust Level : Maximum",

"Care Level : Unlimited",

"Smile Generator : Active",

"Special Person Status : Confirmed",

"",

"System Observation:",

"Zandu Blam has a unique ability to make ordinary days better.",

"",

"Analyzing Importance Level...",

"",

"Importance Level : VERY HIGH ❤️",

"",

"Final Analysis Complete."

];

let i = 0;

startBtn.onclick = function(){

startBtn.style.display = "none";

const interval = setInterval(function(){

if(i < lines.length){

terminal.innerHTML += "<br>" + lines[i];

i++;

}else{

clearInterval(interval);

terminal.innerHTML += `

<br><br>

<b>Final Question:</b>

<br><br>

Does Zandu Blam Hema deserve unlimited appreciation? ❤️

<br><br>

<button id="yes">YES ❤️</button>
<button id="no">NO 🙈</button>

`;

setupButtons();

}

},800);

};

const comments = [

"Think Again 😜",

"Wrong Answer 😂",

"System Rejects NO ❌",

"Nice Try 😏",

"Only YES Works ❤️",

"Zandu Blam Approved 🌸"

];

let commentIndex = 0;

function setupButtons(){

const noBtn = document.getElementById("no");
const comment = document.getElementById("comment");

noBtn.addEventListener("mouseover",function(){

const x = Math.random()*(window.innerWidth-150);
const y = Math.random()*(window.innerHeight-100);

noBtn.style.position = "absolute";
noBtn.style.left = x + "px";
noBtn.style.top = y + "px";

comment.innerText =
comments[commentIndex % comments.length];

commentIndex++;

});

document.getElementById("yes").onclick = function(){

document.body.innerHTML = `

<h1 style="color:#d6336c;">
❤️ ZANDU BLAM APPROVED ❤️
</h1>

<h2>
Official Result: Extremely Special Person 🌸
</h2>

<div class="appreciation">

<h2 style="text-align:center;color:#d6336c;">
A Little Message For Hema
</h2>

<p>
Dear Zandu Blam,
</p>

<p>
This page may look like a funny analysis report, but the message behind it is real.
</p>

<p>
You have a way of making conversations enjoyable, turning ordinary moments into memorable ones, and bringing positive energy wherever you go.
</p>

<p>
Your smile, your personality, and your unique way of being yourself make you genuinely special.
</p>

<p>
Life becomes a little brighter when people like you are around.
</p>

<p>
So according to this highly advanced and completely unbiased system...
</p>

<p style="text-align:center;font-size:24px;color:#d6336c;">
❤️ Zandu Blam Is Awesome ❤️
</p>

<p>
With Lots Of Appreciation,
</p>

<p>
<b>Debapriya</b>
</p>

</div>

`;

};

}

</script>

</body>
</html>
